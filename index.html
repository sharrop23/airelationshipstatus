<style>
/* Layout: one centered column like flipping through early-2000s IM windows and profile cards; results scroll as a stack of tinted, sticker-y panels.
   Two themes: "faded analog" (light, default) and "late-night chat room" (dark). Dark follows the system unless the toggle picks one. */
:root{
  color-scheme:light;
  /* foundation: faded analog */
  --ivory:#FBF5EA; --paper:#FFFDF8; --rose:#EBC0C3; --blue:#B5CDE6; --lav:#D3C5EE; --gold:#E2C886;
  /* accents, one at a time */
  --tomato:#D6402A; --pista:#C4E0A6; --cobalt:#2747C9; --mari:#F0A531;
  --ink:#211C3D; --ink-2:#4B4568; --muted:#6E678A; --line:rgba(33,28,61,.16);
  /* roles */
  --bg:var(--ivory); --surface:var(--paper);
  --heart:var(--tomato); --heart-soft:#FBE1DB;   /* "you" on results */
  --pick:var(--cobalt); --pick-soft:#E2E9FB;     /* selections on questions */
  --bar:rgba(33,28,61,.2); --mint:#2D7A4C;
  /* surfaces & strokes that change per theme */
  --edge:var(--ink); --shadow:var(--ink); --frost:rgba(255,253,248,.72); --opt-bg:var(--ivory);
  --glow-1:rgba(211,197,238,.85); --glow-2:rgba(181,205,230,.8); --glow-3:rgba(235,192,195,.7);
  --btn-2:#211C3D; --btn-text:#fff;
  --bar-1:var(--blue); --bar-2:var(--lav); --bar-3:var(--rose); --card-pop:var(--lav);
  --status-bg:linear-gradient(135deg, var(--lav) 0%, var(--rose) 55%, var(--gold) 100%);
  --tint-blue:#E6EEF8; --tint-lav:#EEE8F9; --tint-rose:#F8E7E7; --tint-gold:#F7EFD9; --tint-pista:#EAF4DF;
  --banner-bg:#FCEBC8; --banner-b:#9A5A00; --hilite:var(--rose); --people-off:var(--lav); --big-shadow:var(--rose);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:22px;
  --pop:4px 4px 0 var(--shadow);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --ink:#F4EFFF; --ink-2:#CDC5EA; --muted:#A39BC6; --line:rgba(244,239,255,.17);
  --bg:#16122B; --surface:#221C3F; --paper:#2A2449; --ivory:#1C1735;
  --tomato:#FF6F57; --heart:#FF6F57; --heart-soft:rgba(255,111,87,.16);
  --cobalt:#8EA4FF; --pick:#8EA4FF; --pick-soft:rgba(142,164,255,.16);
  --mari:#FFBE4D; --pista:#B6E58F; --mint:#8EE0A8;
  --bar:rgba(244,239,255,.26);
  --edge:#C9BCFF; --shadow:#07050F; --frost:rgba(34,28,63,.72); --opt-bg:#1C1735;
  --glow-1:rgba(122,82,214,.45); --glow-2:rgba(39,71,201,.4); --glow-3:rgba(214,64,120,.32);
  --btn-2:#DCD2FF; --btn-text:#16122B;
  --bar-1:#3B4F86; --bar-2:#55418F; --bar-3:#8A3F6C; --card-pop:#6B4FC7;
  --status-bg:linear-gradient(135deg, #4C3A9C 0%, #8E3A72 58%, #A8702A 100%);
  --tint-blue:#1E2747; --tint-lav:#2A2250; --tint-rose:#35203E; --tint-gold:#332A25; --tint-pista:#1F3130;
  --banner-bg:#3A2D17; --banner-b:#FFBE4D; --hilite:rgba(255,111,87,.35); --people-off:#3E3570; --big-shadow:#5A2440;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#F4EFFF; --ink-2:#CDC5EA; --muted:#A39BC6; --line:rgba(244,239,255,.17);
  --bg:#16122B; --surface:#221C3F; --paper:#2A2449; --ivory:#1C1735;
  --tomato:#FF6F57; --heart:#FF6F57; --heart-soft:rgba(255,111,87,.16);
  --cobalt:#8EA4FF; --pick:#8EA4FF; --pick-soft:rgba(142,164,255,.16);
  --mari:#FFBE4D; --pista:#B6E58F; --mint:#8EE0A8;
  --bar:rgba(244,239,255,.26);
  --edge:#C9BCFF; --shadow:#07050F; --frost:rgba(34,28,63,.72); --opt-bg:#1C1735;
  --glow-1:rgba(122,82,214,.45); --glow-2:rgba(39,71,201,.4); --glow-3:rgba(214,64,120,.32);
  --btn-2:#DCD2FF; --btn-text:#16122B;
  --bar-1:#3B4F86; --bar-2:#55418F; --bar-3:#8A3F6C; --card-pop:#6B4FC7;
  --status-bg:linear-gradient(135deg, #4C3A9C 0%, #8E3A72 58%, #A8702A 100%);
  --tint-blue:#1E2747; --tint-lav:#2A2250; --tint-rose:#35203E; --tint-gold:#332A25; --tint-pista:#1F3130;
  --banner-bg:#3A2D17; --banner-b:#FFBE4D; --hilite:rgba(255,111,87,.35); --people-off:#3E3570; --big-shadow:#5A2440;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:
    radial-gradient(42rem 30rem at -10% -5%, var(--glow-1), transparent 60%),
    radial-gradient(36rem 28rem at 110% 18%, var(--glow-2), transparent 62%),
    radial-gradient(40rem 30rem at 50% 115%, var(--glow-3), transparent 60%);
  background-attachment:fixed}
.wrap{max-width:640px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:10px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.banner{background:var(--banner-bg);border:1.5px dashed var(--mari);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:18px}
.banner b{color:var(--banner-b)}

/* sparkle: the Y2K glint, used on the two big reveal moments only */
.spark{display:inline-block;width:.5em;height:.5em;background:var(--mari);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);vertical-align:.45em;margin-left:.08em;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.7) rotate(45deg)}}

/* --- Intro --- */
.intro{display:grid;gap:22px;padding-top:10px}
.intro h1{font-size:clamp(44px, 11vw, 76px);font-weight:800}
/* subheading: an upright, slightly techy grotesk, smaller than the title, in cobalt with a soft marker swipe */
.intro-sub{margin-top:-8px;font:600 clamp(18px, 4.6vw, 22px)/1.25 "Space Grotesk", "Avenir Next", system-ui, sans-serif;color:var(--cobalt);letter-spacing:.005em;text-wrap:balance}
.intro-sub::after{content:"";display:block;width:4.2em;height:6px;margin-top:6px;border-radius:3px;background:var(--hilite);opacity:.9}
.intro h1 em{font-style:normal;color:var(--tomato);background:linear-gradient(transparent 62%, var(--hilite) 62%, var(--hilite) 92%, transparent 92%);padding:0 .06em}
.lede{font-size:18px;color:var(--ink-2);max-width:34em}
.promises{display:grid;gap:10px;margin:0;padding:16px 18px;list-style:none;background:var(--frost);border:1.5px solid var(--line);border-radius:18px}
.promises li{display:flex;gap:12px;align-items:baseline;font-size:15px;color:var(--ink-2)}
.promises li b{color:var(--ink);font-weight:600}
.promises .tick{flex:none;width:22px;height:22px;border-radius:50%;background:var(--pista);border:1.5px solid var(--edge);display:grid;place-items:center;font:600 12px/1 var(--mono);color:#211C3D;transform:translateY(4px)}
.byline{font-size:14px;color:var(--muted)}

/* pill buttons: flat fill, small hard shadow */
.btn{appearance:none;cursor:pointer;border-radius:999px;padding:14px 26px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:10px;
  color:var(--btn-text);border:2px solid var(--edge);box-shadow:3px 3px 0 var(--shadow);
  background:var(--btn-2);
  transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--shadow)}
.btn .spark{background:#FFE7A3;width:.8em;height:.8em;vertical-align:0;margin-left:0}
/* main call to action: flat, deep tomato so white text clears 5.5:1 in both themes */
.btn.heart{color:#fff;background:#C2321D;border-color:#211C3D}
.btn.heart:hover{background:#AE2A16}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2);padding:12px 6px;font-weight:600;font-size:15px}
.btn.ghost:hover{color:var(--ink);transform:none;box-shadow:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* --- Question card: a little IM window --- */
.progress{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.dots{display:flex;gap:5px;flex:1}
.dots i{height:8px;flex:1;border-radius:4px;background:var(--frost);border:1px solid var(--line);transition:background .25s}
.dots i.on{background:linear-gradient(180deg, color-mix(in srgb, var(--cobalt) 70%, #fff), var(--cobalt));border-color:var(--cobalt)}
.dot-btn{appearance:none;flex:1;display:flex;align-items:center;padding:8px 0;margin:-8px 0;border:0;background:none;cursor:pointer}
.dot-btn i{flex:1;height:8px;border-radius:4px;background:var(--frost);border:1px solid var(--line);transition:background .25s, transform .15s}
.dot-btn.on i{background:linear-gradient(180deg, color-mix(in srgb, var(--cobalt) 70%, #fff), var(--cobalt));border-color:var(--cobalt)}
.dot-btn:hover i{transform:scaleY(1.6)}
.dot-btn.here i{box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--cobalt)}
.count{font:500 13px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.card{position:relative;background:var(--surface);border:2px solid var(--edge);border-radius:20px;padding:56px 22px 26px;box-shadow:6px 6px 0 var(--card-pop), 6px 6px 0 2px var(--edge);animation:in .35s ease both;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:34px;border-bottom:2px solid var(--edge);
  background:linear-gradient(90deg, var(--bar-1), var(--bar-2) 55%, var(--bar-3))}
.card::after{content:"";position:absolute;top:11px;left:14px;width:52px;height:12px;
  background:radial-gradient(circle at 6px 6px, var(--tomato) 5px, transparent 5.5px), radial-gradient(circle at 26px 6px, var(--mari) 5px, transparent 5.5px), radial-gradient(circle at 46px 6px, var(--pista) 5px, transparent 5.5px)}
@keyframes in{from{opacity:.0;transform:translateY(12px) rotate(-.6deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.card,.reveal-mark,.spark,.msg,.spec-pic{animation:none!important;transition:none!important}}
.card h2{font-size:clamp(26px, 6.4vw, 34px);font-weight:700;margin:8px 0 6px}
.hint{color:var(--muted);font-size:14.5px;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2, minmax(0,1fr))}
@media (max-width:440px){.opts.two{grid-template-columns:1fr}}
.opt{appearance:none;text-align:left;cursor:pointer;background:var(--opt-bg);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;font-size:15.5px;font-weight:500;display:flex;gap:12px;align-items:center;transition:border-color .12s, background .12s, transform .12s, box-shadow .12s;min-width:0}
.opt:hover{border-color:var(--edge);transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--edge)}
.opt .box{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-2);background:var(--paper);display:grid;place-items:center;transition:all .12s}
.opt.radio .box,.opt.circle .box{border-radius:50%}
.opt.circle .box{width:22px;height:22px}
.opt[aria-pressed="true"]{border-color:var(--pick);background:var(--pick-soft);box-shadow:2px 2px 0 var(--pick)}
.opt[aria-pressed="true"] .box{background:var(--pick);border-color:var(--pick)}
.opt[aria-pressed="true"] .box::after{content:"";width:6px;height:10px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.opt.radio[aria-pressed="true"] .box::after{width:8px;height:8px;border:0;border-radius:50%;background:var(--surface);transform:none}
.opt:disabled{opacity:.4;cursor:not-allowed}
.at-max .opt[aria-pressed="false"]:not([data-id="none"]):not([data-id="notyet"]){opacity:.5}
.max-note{min-height:1.4em;margin-top:12px;font:600 14px/1.35 var(--body);color:var(--heart)}
.max-note:empty{margin-top:0;min-height:0}
.max-note.nudge{animation:nudge .35s ease}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.max-note.nudge{animation:none}}
/* grouped options: each category is its own tinted box with a clear heading */
.groups{display:grid;gap:14px}
.group{display:grid;gap:10px;padding:14px 14px 14px 16px;border:1.5px solid var(--line);border-left:6px solid var(--g-accent);border-radius:16px;background:var(--g-tint)}
.group:nth-child(1){--g-accent:var(--blue);--g-tint:var(--tint-blue)}
.group:nth-child(2){--g-accent:var(--lav);--g-tint:var(--tint-lav)}
.group:nth-child(3){--g-accent:var(--rose);--g-tint:var(--tint-rose)}
.group:nth-child(4){--g-accent:var(--gold);--g-tint:var(--tint-gold)}
.group-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.group-label{font:700 19px/1.2 var(--display);color:var(--ink);margin:0;letter-spacing:-.01em}
.group-note{font-size:13.5px;color:var(--ink-2)}

.ratings{display:grid;gap:16px}
.rate-row{display:grid;gap:8px}
.rate-name{font-size:15.5px;font-weight:500}
.rate-btns{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:6px}
.rate{appearance:none;cursor:pointer;border:1.5px solid var(--line);background:var(--opt-bg);border-radius:12px;padding:8px 4px;display:grid;justify-items:center;gap:2px;transition:border-color .12s, background .12s, box-shadow .12s}
.rate:hover{border-color:var(--edge)}
.rate b{font:700 18px/1 var(--display)}
.rate span{font-size:12px;color:var(--muted)}
.rate[aria-checked="true"]{border-color:var(--pick);background:var(--pick-soft);box-shadow:2px 2px 0 var(--pick)}
.rate[aria-checked="true"] b{color:var(--pick)}
.feel{display:grid;grid-template-columns:1fr;gap:8px}
.feel .opt{align-items:flex-start;padding:13px 14px;font-size:14.5px;line-height:1.35}
.feel .opt::before{margin-top:2px}
.feel-txt b{margin-right:2px}
.feel-txt b{font-weight:700}
.feel-txt span{opacity:.85}
@media (max-width:480px){.feel{grid-template-columns:1fr}}
.feel .opt .box{display:none}
/* feelings: warm for eager, cool for uneasy, grey for unbothered */
.feel .opt[data-id="giddy"]{--c:#B8510A}
.feel .opt[data-id="curious"]{--c:#B0336A}
.feel .opt[data-id="torn"]{--c:#6447B8}
.feel .opt[data-id="mute"]{--c:#6E678A}
.feel .opt[data-id="overit"]{--c:#34407E}
.feel .opt,.tiles .opt{--c-line:var(--c);background:color-mix(in srgb, var(--c) 13%, var(--opt-bg));border-color:color-mix(in srgb, var(--c-line) 45%, transparent)}
.feel .opt::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;background:var(--c-line);box-shadow:0 0 0 3px color-mix(in srgb, var(--c-line) 25%, transparent)}
.feel .opt:hover,.tiles .opt:hover{border-color:var(--c-line);box-shadow:2px 2px 0 var(--c-line)}
.feel .opt[aria-pressed="true"],.tiles .opt[aria-pressed="true"]{background:var(--c);border-color:var(--edge);color:#fff;box-shadow:3px 3px 0 var(--shadow);transform:translate(-1px,-1px)}
.feel .opt[aria-pressed="true"]::before{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .feel .opt,:root:not([data-theme="light"]) .tiles .opt{--c-line:color-mix(in srgb, var(--c) 55%, #fff)}}
:root[data-theme="dark"] .feel .opt,:root[data-theme="dark"] .tiles .opt{--c-line:color-mix(in srgb, var(--c) 55%, #fff)}
/* group chat preview (talk) */
.gc{border:2px solid var(--edge);border-radius:16px;background:var(--opt-bg);overflow:hidden;margin-bottom:14px;box-shadow:3px 3px 0 var(--shadow)}
.gc-top{display:flex;align-items:center;gap:8px;padding:9px 12px;font:600 13.5px/1 var(--body);border-bottom:1.5px solid var(--line);background:linear-gradient(90deg, var(--bar-1), var(--bar-2))}
.gc-top small{margin-left:auto;font:500 11px/1 var(--mono);color:var(--ink-2)}
.gc-dot{width:9px;height:9px;border-radius:50%;background:var(--pista);border:1.5px solid var(--edge)}
.gc-body{display:flex;flex-direction:column;gap:7px;padding:12px;min-height:178px}
.msg{max-width:80%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.3;animation:pop .32s cubic-bezier(.2,.9,.3,1.3) both}
.msg.l{align-self:flex-start;background:var(--surface);border:1.5px solid var(--line);border-bottom-left-radius:4px}
.msg.r{align-self:flex-end;background:var(--pick);color:var(--surface);border-bottom-right-radius:4px}
.msg.sys{align-self:center;max-width:100%;background:none;font:500 12px/1.3 var(--mono);color:var(--muted);text-align:center;padding:4px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.tiles{display:grid;grid-template-columns:repeat(5, minmax(0,1fr));gap:8px}
.tile{flex-direction:column;justify-content:center;text-align:center;padding:12px 4px;gap:8px;min-height:72px}
.tile .box{display:none}
/* volume scale: quiet and grey at "never", loud and saturated at "constantly" */
.tiles .opt[data-id="never"]{--c:#6E678A}
.tiles .opt[data-id="rarely"]{--c:#4766B0}
.tiles .opt[data-id="sometimes"]{--c:#2747C9}
.tiles .opt[data-id="often"]{--c:#6447B8}
.tiles .opt[data-id="constantly"]{--c:#9C2A78}
.tiles .opt[data-id="never"] .lbl{font-size:13px;font-weight:500;font-style:italic}
.tiles .opt[data-id="rarely"] .lbl{font-size:14px;font-weight:600}
.tiles .opt[data-id="sometimes"] .lbl{font-size:14.5px;font-weight:700}
.tiles .opt[data-id="often"] .lbl{font-size:15.5px;font-weight:800}
.tiles .opt[data-id="constantly"] .lbl{font:800 15px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em}
.vol{display:flex;align-items:flex-end;gap:3px;height:20px}
.vol i{width:5px;border-radius:2px;border:1.5px solid var(--c-line);background:transparent}
.vol i:nth-child(1){height:6px}.vol i:nth-child(2){height:10px}.vol i:nth-child(3){height:15px}.vol i:nth-child(4){height:20px}
.tiles .opt[data-id="rarely"] .vol i:nth-child(-n+1),
.tiles .opt[data-id="sometimes"] .vol i:nth-child(-n+2),
.tiles .opt[data-id="often"] .vol i:nth-child(-n+3),

    {"id":"uses","type":"multi","check":"circle","layout":"two","kicker":"No-judgment zone","title":"Where does AI show up in your work today?","hint":"Pick all that apply.","short":"Where creators use AI","options":[["brainstorm","Brainstorming and ideation"],["research","Research and learning"],["writing","Writing and editing"],["visual","Visual creation and design"],["music","Music and audio"],["video","Video and animation"],["coding","Coding and technical work"],["marketing","Marketing and audience growth"],["ops","Business operations and administration"],["feedback","Feedback and critique"],["none","I don't use AI in my creative work"]],"exclusive":["none"]},

    {"id":"hesitation","type":"multi","max":3,"exclusive":["none"],"kicker":"Real talk","title":"What are your biggest hesitations, if any, when using AI in creative work?","hint":"Pick up to 3.","short":"Biggest hesitation","options":[["quality","It doesn't produce work that's good enough."],["personal","It makes creative work feel less personal or original."],["copyright","I'm worried about copyright, ownership, or compensation."],["training","I'm uncomfortable with how AI models are trained."],["perception","I'm worried about how audiences or other creatives will perceive me."],["reliability","I don't trust the accuracy or reliability of AI."],["dependence","I'm worried about becoming dependent on it."],["value","It feels like it undermines the value of human creativity."],["none","I don't really have any hesitations."],["other","Something else."]]},

    {"id":"disclose","type":"single","kicker":"Last one: just between us","title":"Have you ever avoided mentioning that you used AI in something you created?","hint":"","short":"Avoided mentioning AI use","options":[["frequently","Yes, frequently."],["occasionally","Yes, occasionally."],["once","Once or twice."],["transparent","No, I'm comfortable being transparent."],["nouse","I don't use AI."]]}
  ],
  "statuses": {
    "notyou": {"name": "It's Not You, It's Me", "line": "You don't use AI and you're not particularly interested. Boundaries are attractive.", "roast": "Okay, so you and AI are not together, and honestly? Good for you, queen. You looked the entire future of technology dead in the eyes and said “no thank you, I’m busy,” which is the most powerful thing I have ever witnessed. I could never. I can’t even say no to a free sample at the grocery store."},

    "workspouse": {"name": "Work Spouse", "line": "AI handles the business, admin and tedious tasks. The creative work stays primarily human.", "roast": "Okay, so AI does all your boring work stuff and you keep the creative part for yourself. That’s a work spouse! That is the healthiest relationship anyone has ever had, ever. It answers your emails. It never asks how your weekend was. Honestly, get it a little card and a muffin."},

    "married": {"name": "Married to the Machine", "line": "AI is woven into practically everything you do. This one's committed.", "roast": "OH MY GOD, you’re MARRIED. AI is in your brainstorms, your drafts, your edits, your whole life. You two are basically one person now. I’m so happy for you. I’m going to cry at the wedding. I’m going to give a speech nobody asked for and it’s going to be mostly about me."}
  }
}
</script>

<div class="themebar"><span class="anon-chip" id="anon-chip" title="A random name made on this device. It is never saved with your answers."></span><button class="theme-btn" id="theme-btn" type="button" aria-pressed="false"><span class="ico" aria-hidden="true">☾</span><span class="lbl">Dark mode</span></button></div>
<div class="wrap" id="app" aria-live="polite"></div>
<footer class="wrap" style="padding-block:0 32px">Not affiliated with any AI company. Anonymous by design. No names, no emails, no IP addresses stored with your answers.</footer>

<script>
(function(){
"use strict";
/* ============ CONFIG ============
   endpoint: the Google Apps Script web app (ends in /exec) that saves answers and returns totals.
   liveHosts: the page talks to that endpoint only when it is opened on one of these hosts, so the
   claude.ai preview and local copies keep using sample data. shareUrl: the link people pass on. */
var CONFIG = {
  endpoint: "https://script.google.com/macros/s/AKfycbx5vMlhNpQpCD-DdqWLHbXbCMNIuLN7PIMQboelpViyS3pihNUrleFrQxTYmBcp4H-c/exec",
  liveHosts: ["airelationshipstatus.com", "www.airelationshipstatus.com"],
  shareUrl: "https://airelationshipstatus.com"
};
var ON_LIVE_HOST = CONFIG.liveHosts.indexOf(location.hostname) >= 0;

var DATA = JSON.parse(document.getElementById("survey-data").textContent);
var Q = DATA.questions, STATUSES = DATA.statuses;
/* Activity zones for Q6. "Around the work" is support and business; the other two touch the creative work itself. */
var AROUND = ["research","coding","marketing","ops"], PROCESS = ["brainstorm","feedback"], MAKING = ["writing","visual","music","video"];
var STORE_KEY = "yrwai_v2";

var app = document.getElementById("app");
var state = { i: -1, answers: {}, results: null, mode: detectMode() };

function detectMode(){
  if (window.google && google.script && google.script.run) return "gas";
  if (CONFIG.endpoint && ON_LIVE_HOST) return "fetch";
  return "preview";
}
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

/* ---------- anonymous screen name ----------
   Made at random on this device so people can see they're anonymous. Never sent with answers. */
var ANON = (function(){
  var saved = store("yrwai_name3"); if (saved) return saved;
  var A = ["Feral","Unhinged","Dramatic","Overcaffeinated","Haunted","Delulu","Chaotic","Sleepless","Suspicious","Theatrical","Rogue","Petty","Divorced","Bootleg","Cursed","Litigious","Menacing","Spicy","Emotional","Disgraced","Glittery","Sweaty","Moody","Problematic"];
  var N = ["Possum","Raccoon","Goose","Gremlin","Pigeon","Ferret","Goblin","Croissant","Wizard","Mothman","Duchess","Llama","Toaster","Cryptid","Hamster","Diva","Gargoyle","Lasagna","Pickle","Burrito","Disco","Karaoke","Kombucha","Cowboy"];
  var r = function(n){ try{ var b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] % n; }catch(e){ return Math.floor(Math.random()*n); } };
  var name = A[r(A.length)] + " " + N[r(N.length)] + " " + (1000 + r(9000));
  store("yrwai_name3", name);
  return name;
})();
/* "live" anonymous identity: the name shuffles like a slot machine, then settles over a marching squiggle */
function scrambleInto(el, text){
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce){ el.textContent = text; return; }
  var pool = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz", start = Date.now(), dur = 900;
  var t = setInterval(function(){
    var k = Math.min(1, (Date.now() - start) / dur), keep = Math.floor(text.length * k);
    el.textContent = text.slice(0, keep) + text.slice(keep).replace(/[^ ]/g, function(){ return pool[Math.floor(Math.random()*pool.length)]; });
    if (k >= 1){ clearInterval(t); el.textContent = text; }
  }, 45);
}
function anonName(){ return '<b class="anon-name">' + esc(ANON) + '</b>'; }
document.getElementById("anon-chip").innerHTML = '<span class="pre">incognito as</span> ' + anonName();
scrambleInto(document.querySelector("#anon-chip .anon-name"), ANON);

/* ---------- theme: follows the system until the visitor picks one ---------- */
(function(){
  var KEY = "yrwai_theme", root = document.documentElement, btn = document.getElementById("theme-btn");
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function saved(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function isDark(){ var t = root.getAttribute("data-theme"); return t ? t === "dark" : !!(mq && mq.matches); }
  function paint(){
    var d = isDark();
    btn.setAttribute("aria-pressed", d ? "true" : "false");
    btn.querySelector(".ico").textContent = d ? "☀" : "☾";
    btn.querySelector(".lbl").textContent = d ? "Light mode" : "Dark mode";
  }
  var t = saved(); if (t === "dark" || t === "light") root.setAttribute("data-theme", t);
  btn.onclick = function(){
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem(KEY, next); }catch(e){}
    paint();
  };
  if (mq && mq.addEventListener) mq.addEventListener("change", paint);
  paint();
})();
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function h(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content; }
function pct(n, d){ return d ? Math.round(100*n/d) : 0; }

/* ---------- derived answers ---------- */
// Q6 is stored as ["brainstorm:often", "research:some", ...] or ["none"].
function usesMap(a){ var m = {}; (a.uses||[]).forEach(function(x){ var k = String(x).split(":")[0]; if (k !== "none") m[k] = true; }); return m; }
function usesAI(a){ return Object.keys(usesMap(a)).length > 0; }
/* Relationship status. Weighs behavior (what and how often), sentiment (feel), creative integration
   (whether AI touches the work itself) and openness (talk, disclosure). Frequency alone never decides it. */
function statusOf(a){
  var m = usesMap(a), acts = Object.keys(m), feel = a.feel, disclose = a.disclose;
  if (!acts.length){
    var notInto = feel === "mute" || feel === "overit" || a.line === "none";
    return notInto ? "notyou" : "singlecurious";
  }
  var creative = acts.filter(function(k){ return PROCESS.indexOf(k) >= 0 || MAKING.indexOf(k) >= 0; }).length;
  var hides = disclose === "frequently" || disclose === "occasionally";
  var uneasy = false; // discomfort with talking about it now comes from disclosure (Q10)
  var mixed = feel === "torn" || feel === "overit";
  var warm = feel === "giddy" || feel === "curious";
  var opens = disclose === "transparent" || disclose === "once";
  var hearsTalk = ["sometimes","often","constantly"].indexOf(a.talk) >= 0;
  // deep integration: broad use, much of it often, reaching into the creative work, and not hidden
  if (acts.length >= 6 && creative >= 3 && !hides) return "married";
  if (hides || uneasy) return "situationship";
  if (mixed) return "complicated";
  if (!creative) return "workspouse";
  if (opens && (warm || hearsTalk)) return "open";
  return "fwb";
}
function activeQuestions(){ return Q.filter(function(q){ return !q.onlyIfUses || usesAI(state.answers); }); }

/* ---------- aggregation (same logic as Code.gs, used for preview mode) ---------- */
function aggregate(rows){
  var agg = { n: rows.length, q: {} };
  rows.forEach(function(r){
    Object.keys(r).forEach(function(k){
      var v = r[k]; if (v===undefined || v===null || v==="") return;
      var slot = agg.q[k] || (agg.q[k] = { answered:0, counts:{}, sum:0 });
      slot.answered++;
      (Array.isArray(v) ? v : [v]).forEach(function(x){ slot.counts[x] = (slot.counts[x]||0) + 1; });
      if (typeof v === "number") slot.sum += v;
    });
  });
  return agg;
}

/* Preview-only sample data, clearly labelled on screen. Seeded so it's stable. */
function sampleRows(){
  var seed = 7; function rnd(){ seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }
  function pick(weights){ var keys=Object.keys(weights), t=0, s=0; keys.forEach(function(k){t+=weights[k];}); var x=rnd()*t; for(var i=0;i<keys.length;i++){ s+=weights[keys[i]]; if(x<=s) return keys[i]; } return keys[0]; }
  function some(weights, max){ var out=[]; Object.keys(weights).forEach(function(k){ if(rnd()<weights[k]) out.push(k); }); return max? out.slice(0,max): out; }
  var rows=[];
  var ACTS = {brainstorm:.5,research:.55,writing:.4,visual:.2,music:.1,video:.18,coding:.15,marketing:.35,ops:.45,feedback:.2};
  for (var i=0;i<42;i++){
    var a={};
    a.medium = some({visual:.3,shortvideo:.35,longvideo:.25,written:.25,podcast:.15,photo:.18,music:.25,writing:.2,design:.15,other:.05},3); if(!a.medium.length) a.medium=["visual"];
    a.stage = pick({fulltime:3,side:4,passion:4,aspiring:1});
    a.chores = some({admin:.55,promo:.45,production:.3,friction:.25,bizdev:.45},3); if(!a.chores.length) a.chores=["none"];
    a.guess = [1,2,2,3,3,3,4,4,5,5,6,7][Math.floor(rnd()*12)]*10;
    var user = rnd() < .68;
    a.uses = user ? Object.keys(ACTS).filter(function(k){ return rnd() < ACTS[k]; }) : ["none"];
    if (user && !a.uses.length) a.uses = ["research"];
    a.feel = user ? pick({giddy:3,curious:5,torn:4,mute:1,overit:1})
                  : pick({giddy:1,curious:4,torn:2,mute:3,overit:4});
    a.talk = pick({never:3,rarely:5,sometimes:4,often:2,constantly:1});
    a.hesitation = some({quality:.3,personal:.4,copyright:.4,training:.3,perception:.3,reliability:.2,dependence:.2,value:.3,other:.05},3); if(!a.hesitation.length) a.hesitation=["none"];
    a.line = pick({none:2,personal:2,around:4,process:4,final:2,anything:1});
    a.disclose = user ? pick({frequently:2,occasionally:4,once:3,transparent:4}) : "nouse";
    a.uses_ai = usesAI(a) ? "yes" : "no";
    a.status = statusOf(a);
    rows.push(a);
  }
  return rows;
}

/* ---------- backend ---------- */
function payload(){
  var a = JSON.parse(JSON.stringify(state.answers));
  a.uses_ai = usesAI(a) ? "yes" : "no";
  a.status = statusOf(a);
  return a;
}
function call(fn, arg){
  return new Promise(function(resolve, reject){
    if (state.mode === "gas"){
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      return arg===undefined ? r[fn]() : r[fn](arg);
    }
    if (state.mode === "fetch"){
      var req = fn === "getResults"
        ? fetch(CONFIG.endpoint + "?api=results")
        : fetch(CONFIG.endpoint, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({ fn: fn, data: arg }) });
      return req.then(function(r){ return r.json(); }).then(function(j){ if (j && j.error) reject(new Error(j.error)); else resolve(j); }, reject);
    }
    // preview
    setTimeout(function(){
      if (fn === "saveFollowup" || fn === "saveReaction") return resolve({ ok:true, preview:true });
      var rows = sampleRows(); if (fn === "submit") rows.push(arg);
      else if (fn === "getResults" && state.answers && state.answers.uses) rows.push(payload()); // keep your own answer in the preview count
      resolve(aggregate(rows));
    }, 700);
  });
}

/* ---------- screens ---------- */
function previewBanner(){
  return state.mode === "preview" ? '<div class="banner"><b>Preview mode.</b> Results below use made-up sample data so you can see the layout. Real responses appear once the Google Sheet backend is connected.</div>' : "";
}

function renderIntro(){
  var done = store(STORE_KEY);
  app.innerHTML = previewBanner() + '\
  <section class="intro">\
    <h1>Your <em>AI</em> Relationship Status<span class="spark" aria-hidden="true"></span></h1>\
    <p class="intro-sub">A 3-minute quiz about creativity and AI</p>\
    <p class="lede">Everyone has opinions about AI and art, but almost nobody says what they actually do. Answer 10 quick questions, then see how you compare with other creators.</p>\
    <ul class="promises">\
      <li><span class="tick">✓</span><span><b>Anonymous.</b> Today you\'re ' + anonName() + ', a random name made just for you. No real names, emails or accounts, and nothing ties answers to you.</span></li>\
      <li><span class="tick">✓</span><span><b>No wrong answers.</b> "Never touch it" and "use it daily" are equally welcome.</span></li>\
      <li><span class="tick">✓</span><span><b>You see the results first.</b> Right after the last question.</span></li>\
    </ul>\
    <div class="row">\
      <button class="btn heart" id="start">' + (done ? "See your results" : "Let's find out") + ' <span aria-hidden="true">→</span></button>\
      ' + (done && state.mode==="preview" ? '<button class="btn ghost" id="redo">Take it again (preview only)</button>' : '') + '\
    </div>\
  </section>';
  var introName = app.querySelector(".promises .anon-name"); if (introName) scrambleInto(introName, ANON);
  document.getElementById("start").onclick = function(){
    if (done){ state.answers = done; return showResults(false); }
    state.i = 0; renderQuestion();
  };
  var redo = document.getElementById("redo");
  if (redo) redo.onclick = function(){ store(STORE_KEY, null); try{localStorage.removeItem(STORE_KEY);}catch(e){} state.answers={}; state.i=0; renderQuestion(); };
}

function isAnswered(q){
  var v = state.answers[q.id];
  if (q.type === "multi" || q.type === "freq") return Array.isArray(v) && v.length > 0;
  if (q.type === "ratings") return !!v && q.options.every(function(o){ return v[o[0]]; });
  return v !== undefined && v !== null && v !== "";
}

function optButton(q, id, label, extra){
  var v = state.answers[q.id];
  var on = q.type === "multi" ? (v||[]).indexOf(id) >= 0 : String(v) === String(id);
  return '<button type="button" class="opt ' + (q.type==="multi"?"":"radio") + (q.check === "circle" ? " circle" : "") + '" data-id="' + esc(id) + '" aria-pressed="' + on + '">' + (extra||"") + '<span class="box" aria-hidden="true"></span><span>' + esc(label) + '</span></button>';
}

function renderQuestion(){
  var qs = activeQuestions(), q = qs[state.i], total = Q.length, pos = Q.indexOf(q);
  // preview only: the progress dots become buttons so you can jump straight to any question
  var jump = state.mode === "preview";
  var dots = Q.map(function(qq, k){
    var cls = (k <= pos ? "on" : "") + (k === pos ? " here" : "");
    return jump ? '<button type="button" class="dot-btn ' + cls + '" data-jump="' + k + '" title="Jump to question ' + (k+1) + '" aria-label="Jump to question ' + (k+1) + ': ' + esc(qq.title) + '"' + (k === pos ? ' aria-current="step"' : '') + '><i></i></button>'
                : '<i class="' + cls + '"></i>';
  }).join("");
  var body = "";
  if (q.type === "single" || q.type === "multi"){
    if (q.groups){
      body = '<div class="groups">' + q.groups.map(function(g){ return '<div class="group" role="group" aria-label="' + esc(g.label) + '"><div class="group-head"><p class="group-label">' + esc(g.label) + '</p>' + (g.note ? '<span class="group-note">(' + esc(g.note) + ')</span>' : '') + '</div><div class="opts">' + g.options.map(function(o){ return optButton(q, o[0], o[1]); }).join("") + '</div></div>'; }).join("") + '</div>';
    } else {
      body = '<div class="opts ' + (q.layout||"") + '">' + q.options.map(function(o){ return optButton(q, o[0], o[1]); }).join("") + '</div>';
    }
  } else if (q.type === "ratings"){
    var rv = state.answers[q.id] || {};
    body = '<div class="ratings">' + q.options.map(function(o){
      return '<div class="rate-row" role="radiogroup" aria-label="' + esc(o[1]) + '"><p class="rate-name">' + esc(o[1]) + '</p><div class="rate-btns">' +
        q.scale.map(function(sc){
          var on = String(rv[o[0]]) === sc[0];
          return '<button type="button" class="rate" role="radio" data-item="' + o[0] + '" data-v="' + sc[0] + '" aria-checked="' + on + '"><b>' + sc[0] + '</b><span>' + esc(sc[1]) + '</span></button>';
        }).join("") + '</div></div>';
    }).join("") + '</div>';
  } else if (q.type === "feel"){
    body = '<div class="feel">' + q.options.map(function(o){
      var on = state.answers[q.id] === o[0], dash = o[1].indexOf(" — "), cut = o[1].indexOf(". ");
      var txt = dash > 0 ? '<b>' + esc(o[1].slice(0, dash)) + '</b> <span>— ' + esc(o[1].slice(dash+3)) + '</span>'
        : cut > 0 ? '<b>' + esc(o[1].slice(0, cut+1)) + '</b> <span>' + esc(o[1].slice(cut+2)) + '</span>' : '<b>' + esc(o[1]) + '</b>';
      return '<button type="button" class="opt radio" data-id="' + o[0] + '" aria-pressed="' + on + '"><span class="feel-txt">' + txt + '</span><span class="box" aria-hidden="true"></span></button>';
    }).join("") + '</div>';
  } else if (q.type === "freq"){
    var fm = {}; (state.answers[q.id]||[]).forEach(function(x){ var p = x.split(":"); fm[p[0]] = p[1] || "on"; });
    var lv = {}; q.levels.forEach(function(l){ lv[l[0]] = l[1]; });
    body = '<div class="freq">' + q.options.filter(function(o){ return o[0] !== "none"; }).map(function(o){
      var st = fm[o[0]] || "";

/* "pick up to N": dim the rest once they hit the limit, and explain if they tap another */
function maxNote(q, tried){
  var note = document.getElementById("max-note"), form = document.getElementById("qform"); if (!note) return;
  var full = (state.answers[q.id] || []).length >= q.max && (q.exclusive || []).indexOf((state.answers[q.id] || [])[0]) < 0;
  form.classList.toggle("at-max", full);
  if (tried){
    note.textContent = "You've picked " + q.max + ". Unselect one to choose a different one.";
    note.classList.remove("nudge"); void note.offsetWidth; note.classList.add("nudge");
  } else if (!full) note.textContent = "";
}
function wireQuestion(q){
  var next = document.getElementById("next");
  function refresh(){ next.disabled = !isAnswered(q); }
  refresh();
  app.querySelectorAll(".opt").forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-id");
      if (q.type === "multi"){
        var cur = (state.answers[q.id] || []).slice(), ex = q.exclusive || [];
        var at = cur.indexOf(id);
        if (at >= 0) cur.splice(at, 1);
        else {
          if (ex.indexOf(id) >= 0) cur = [id];
          else {
            cur = cur.filter(function(x){ return ex.indexOf(x) < 0; });
            // at the limit: don't swap anything out silently; ask them to unselect one first
            if (q.max && cur.length >= q.max){ maxNote(q, true); return; }
            cur.push(id);
          }
        }
        state.answers[q.id] = cur;
        app.querySelectorAll(".opt").forEach(function(o){ o.setAttribute("aria-pressed", cur.indexOf(o.getAttribute("data-id")) >= 0); });
        maxNote(q, false);
      } else {
        state.answers[q.id] = q.type === "spectrum" ? +id : (q.type === "freq" ? [id] : id);
        if (q.type === "freq") app.querySelectorAll(".fchip").forEach(function(c){ c.setAttribute("data-lvl", ""); c.querySelector(".fchip-tag").textContent = ""; });
        app.querySelectorAll(".opt").forEach(function(o){ o.setAttribute("aria-pressed", o === b); });
        paintWidget(q);
      }
      refresh();
    };
  });
  app.querySelectorAll(".rate").forEach(function(b){
    b.onclick = function(){
      var item = b.getAttribute("data-item"), cur = state.answers[q.id] || (state.answers[q.id] = {});
      cur[item] = +b.getAttribute("data-v");
      app.querySelectorAll('.rate[data-item="' + item + '"]').forEach(function(o){ o.setAttribute("aria-checked", o === b); });
      refresh();
    };
  });
  app.querySelectorAll(".fchip").forEach(function(c){
    c.onclick = function(){
      var id = c.getAttribute("data-id"), order = ["", "some", "often"], cur = c.getAttribute("data-lvl") || "";
      var nxt = order[(order.indexOf(cur) + 1) % order.length], labels = {};
      q.levels.forEach(function(l){ labels[l[0]] = l[1]; });
      c.setAttribute("data-lvl", nxt);
      c.querySelector(".fchip-tag").textContent = nxt ? labels[nxt] : "";
      c.setAttribute("aria-label", c.querySelector(".fchip-name").textContent + ": " + (nxt ? labels[nxt] : "not used"));
      var list = (state.answers[q.id] || []).filter(function(x){ var k = x.split(":")[0]; return k !== id && k !== "none"; });
      if (nxt) list.push(id + ":" + nxt);
      state.answers[q.id] = list;
      var nb = app.querySelector(".fnone"); if (nb) nb.setAttribute("aria-pressed", "false");
      refresh();
    };
  });
  var spr = document.getElementById("spec-range");
  if (spr){ spr.oninput = function(){ state.answers[q.id] = +spr.value; paintWidget(q); refresh(); }; }
  var range = document.getElementById("guess-range");
  if (range){
    var setVal = function(v){
      v = Math.max(0, Math.min(10, v)); range.value = v; state.answers.guess = v*10;
      document.querySelector("#sread span").textContent = v;
      app.querySelectorAll("#ppl svg").forEach(function(s, k){ s.querySelector("g").setAttribute("class", "p" + (k < v ? " on" : "")); });
      refresh();
    };
    range.oninput = function(){ setVal(+range.value); };
    app.querySelectorAll("#ppl svg").forEach(function(s, k){ s.style.cursor="pointer"; s.onclick = function(){ setVal(+range.value === k+1 ? k : k+1); }; });
  }
  document.getElementById("back").onclick = function(){ if (state.i === 0){ state.i=-1; renderIntro(); } else { state.i--; renderQuestion(); } };
  next.onclick = function(){
    if (!isAnswered(q)) return;
    if (document.getElementById("hp").value) return; // bot
    var qs = activeQuestions();
    if (state.i < qs.length - 1){ state.i++; renderQuestion(); }
    else showResults(true);
  };
}

function labelMap(q){

function qById(id){ return Q.filter(function(q){ return q.id === id; })[0]; }

function ratingsHTML(id){

/* ---------- dramatic stick-figure doodles, one per status ----------

    var body =
      '<path d="M48 18 L40 7 M72 18 L80 7"/><circle cx="40" cy="5" r="4" fill="currentColor" stroke="none"/><circle cx="80" cy="5" r="4" fill="currentColor" stroke="none"/>' +
      '<rect x="26" y="18" width="68" height="50" rx="12"/>' +

    return '<ellipse cx="' + x + '" cy="164" rx="17" ry="3.2" fill="currentColor" stroke="none" opacity=".16"/>' +

  }

    if (cur) out.push(cur); return out;

  function wave(x0, x1, y0, color){ x.beginPath(); x.moveTo(x0, y0); for (var px = x0; px <= x1; px += 2) x.lineTo(px, y0 + Math.sin((px - x0) / 9) * 4); x.strokeStyle = color; x.lineWidth = 4; x.stroke(); }

    var img = new Image();
    img.onload = function(){ paint(img); resolve(c); };

    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(doodleSVG(st.id, INK));

  function paint(doodle){
    var g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#D3C5EE"); g.addColorStop(.55, "#EBC0C3"); g.addColorStop(1, "#E2C886");
    x.fillStyle = g; x.fillRect(0, 0, W, H);

    star(W - 170, 200, 230, "rgba(240,165,49,.85)");
    x.lineWidth = 6; x.strokeStyle = INK; rr(36, 36, W - 72, H - 72, 48); x.stroke();
    x.textBaseline = "top";

    var y = 104;
    x.fillStyle = INK2; x.font = "italic 500 30px " + MONO; x.fillText("incognito as", P, y);
    y += 46; x.fillStyle = INK; x.font = "800 50px " + DISP;
    var nameW = Math.min(x.measureText(ANON).width, W - P*2 - 260); x.fillText(ANON, P, y, W - P*2 - 260);
    wave(P, P + nameW, y + 66, TOMATO);
    y += 112;

    var nameFont = "800 124px " + DISP, nameLines = lines(st.name, nameFont, W - P*2);
    if (nameLines.length > 2){ nameFont = "800 100px " + DISP; nameLines = lines(st.name, nameFont, W - P*2); }

    x.font = nameFont; x.fillStyle = INK; nameLines.forEach(function(l, i){ x.fillText(l, P, y + i*nlh); });

  var shortLabels = function(id){ var m = labelMap(qById(id)), out = {}; Object.keys(m).forEach(function(k){ var d = m[k].indexOf(" — "), c = d > 0 ? d : m[k].indexOf(". "); out[k] = c > 0 ? m[k].slice(0, c) : m[k].replace(/\.$/, ""); }); return out; };

  var gap = usePct - avgGuess;
  var revealMsg = gap >= 8
    ? 'Creators guessed <b>' + avgGuess + '%</b> on average. The real share is <b>' + usePct + '%</b>. People think AI use is rarer than it is, so the people using it assume they\'re the exception.'
    : gap <= -8
      ? 'Creators guessed <b>' + avgGuess + '%</b> on average, but the real share is only <b>' + usePct + '%</b>. AI use is less common than people assume.'
      : 'Creators guessed <b>' + avgGuess + '%</b> on average, close to the real share of <b>' + usePct + '%</b>. This group reads the room well.';
  var youVs = myGuess > usePct + 5 ? "You guessed higher than reality." : myGuess < usePct - 5 ? ("You guessed lower than reality" + (avgGuess < usePct ? ", like most people." : ".")) : "Your guess was right on.";

  var uc = slot("uses").counts, useN = function(k){ return uc[k]||0; };
  var topOf = function(ids){ return Math.max.apply(null, ids.map(useN)); };
  var tA = topOf(AROUND), tP = topOf(PROCESS), tM = topOf(MAKING);
  var usesHeadline = !users ? "Where creators use AI" : (tA >= tP && tA > tM) ? "Mostly around the work, less in it" : (tP > tA && tP >= tM) ? "Mostly for thinking, less for making" : "Right in the making of the work";
  var avgLow = Math.abs(avgGuess-usePct) < 24;
  var youLow = Math.abs(myGuess-usePct) < 24 || (!avgLow && Math.abs(myGuess-avgGuess) < 24);
  if (youLow && avgLow && Math.abs(myGuess-avgGuess) < 24) youLow = false;
  function mark(cls, label, v, low){ return '<div class="reveal-mark ' + cls + (low?" low":"") + '" style="left:0%" data-left="' + v + '"><span class="lab">' + label + '</span><span class="dot"></span></div>'; }

  var shareLink = CONFIG.shareUrl || R.url || (state.mode === "fetch" ? location.href.split("#")[0] : "");
  var snap = snapshot(st, sameStatus, shareLink);
  // the first 100 respondents get the baseline note and a refresh button; past 100 both disappear
  var BASELINE_MAX = 100;
  var early = n <= BASELINE_MAX ? '<section class="baseline" aria-labelledby="baseline-h">\
      <p class="baseline-h" id="baseline-h">You\'re helping establish the baseline.</p>\
      <p>You\'re among the first people defining the relationship. As more creators respond, we\'ll be able to see how your answers compare with others.</p>\
      <p>For now, here\'s what your answers tell us about your own relationship with AI.</p>\
      <div class="row"><button class="btn alt" id="refresh-results" type="button">Refresh results</button><span class="toast" id="refresh-msg" role="status"></span></div>\
    </section>' : '';

  app.innerHTML = previewBanner() + '\
  <div class="results">\
    <section class="status" aria-label="Your result card">\
      <div class="card-top"><p class="eyebrow">Relationship status with AI</p><span class="card-handle">incognito as ' + anonName() + '</span></div>\
      <h1>' + esc(st.name) + '<span class="spark" aria-hidden="true"></span></h1>\
      <div class="doodle">' + doodleSVG(myStatus) + '</div>\
      <p class="roast">' + esc(st.roast) + '</p>\
      <div class="share-badge"><b>' + sameStatus + '%</b><span>of creators share this status</span></div>\
      <p class="share-of">' + n + (n === 1 ? ' creator' : ' creators') + ' answered so far</p>\
      <div class="card-actions"><button class="btn" id="share-card" type="button">Share my result</button><button class="btn alt" id="save-card" type="button">Save as image</button><button class="btn alt" id="share-link" type="button">Share with a friend</button><span class="toast" id="card-msg" role="status"></span></div>\
    </section>\
    <section class="dm" aria-labelledby="dm-h">\
      <div class="dm-top"><span class="dm-dots" aria-hidden="true"></span><span class="dm-title" id="dm-h">Here’s what you told me</span><span class="dm-note">just for you · not on your share card</span></div>\
      <div class="dm-body">' + personalRecap(a).map(function(t, k){ return '<p class="dm-msg" style="animation-delay:' + (0.15 + k*0.12).toFixed(2) + 's">' + esc(t) + '</p>'; }).join("") + '</div>\
    </section>\
    ' + early + '\
    <section class="panel">\
      <p class="eyebrow">The big reveal</p>\
      <h2>How many creators use AI somewhere in their work?</h2>\
      <div class="big">' + usePct + '<small>%</small></div>\
      <div class="reveal" id="reveal" role="img" aria-label="Actual ' + usePct + ' percent, average guess ' + avgGuess + ' percent, your guess ' + myGuess + ' percent">\
        <div class="track"></div>\
        ' + [0,25,50,75,100].map(function(t){ return '<span class="tick" style="left:' + t + '%">' + t + '</span>'; }).join("") + '\
        ' + mark("avg", "Avg guess " + avgGuess + "%", avgGuess, avgLow) + '\
        ' + mark("you", "Your guess " + myGuess + "%", myGuess, youLow) + '\
        ' + mark("actual", "Reality " + usePct + "%", usePct, false) + '\
      </div>\
      <p class="callout">' + revealMsg + ' ' + youVs + '</p>\
      <div class="react" data-quick="reveal" role="group" aria-labelledby="react-q">\
        <p class="react-q" id="react-q">So, how does that number land? <span class="react-opt">Optional</span></p>\
        <div class="chips">\
          <button type="button" class="opt radio" data-react="less" aria-pressed="false"><span class="box"></span><span>Less than I expected</span></button>\
          <button type="button" class="opt radio" data-react="same" aria-pressed="false"><span class="box"></span><span>About what I expected</span></button>\
          <button type="button" class="opt radio" data-react="more" aria-pressed="false"><span class="box"></span><span>More than I expected</span></button>\
        </div>\
        <span class="toast" data-quick-msg role="status"></span>\
      </div>\
    </section>\
    <section class="panel">\
      <p class="eyebrow">What they use it for</p>\
      <h2>' + usesHeadline + '</h2>\
      <p class="sub">Share of creators who use AI, by activity. Your picks are highlighted.</p>\
      ' + LEGEND + '\
      <p class="zone">Around the work</p>' + barsHTML("uses", { ids: AROUND, denom: users || 1 }) + '\
      <p class="zone">Thinking it through</p>' + barsHTML("uses", { ids: PROCESS, denom: users || 1 }) + '\
      <p class="zone">Making the work</p>' + barsHTML("uses", { ids: MAKING, denom: users || 1 }) + '\
    </section>\
    <section class="panel">\
      <p class="eyebrow">The quiet part</p>\
      <h2>' + quietPct + '% rarely or never hear creative friends talk openly about how they use AI</h2>\
      <p class="sub">Meanwhile, ' + usePct + '% use it somewhere in their work. Lots of people doing it, hardly anyone saying it.</p>\
      ' + barsHTML("talk") + '\
    </section>\
    <section class="panel">\
      <p class="eyebrow">Keeping it quiet</p>\
      <h2>' + avoidedPct + '% of creators who use AI have avoided mentioning it at least once</h2>\
      <p class="sub">Among creators who use AI.</p>\
      ' + barsHTML("disclose", { ids: ["frequently","occasionally","once","transparent"], denom: dUsers || 1 }) + '\
    </section>\
    <section class="panel">\
      <p class="eyebrow">Vibe check</p>\
      <h2>How creators feel when AI comes up</h2>\
      ' + barsHTML("feel", { sort: true, labels: shortLabels("feel") }) + '\
    </section>\
    <section class="panel">\
      <p class="eyebrow">Trust</p>\
      <h2>' + (hzLabel ? 'The #1 hesitation: "' + esc(hzLabel) + '"' : 'What holds creators back') + '</h2>\
      ' + barsHTML("hesitation", { sort: true }) + '\
    </section>\
    <section class="panel">\
      <p class="eyebrow">Boundaries</p>\
      <h2>Where creators draw the line</h2>\
      <p class="sub">"AI is fine for…"</p>\
      ' + barsHTML("line") + '\
    </section>\
    <section class="panel">\
      <p class="eyebrow">Universal pain</p>\
      <h2>The chores creators would hand off tomorrow</h2>\
      ' + barsHTML("chores", { sort: true }) + '\
    </section>\
    <section class="panel">\
      <p class="eyebrow">Breaking the silence <span class="react-opt">Optional</span></p>\
      <h2 id="speak-q">"I\'d feel more comfortable talking openly about my AI use if I knew more creative people were using it."</h2>\
      <div class="react" data-quick="speak" role="group" aria-labelledby="speak-q">\
        <div class="chips">\
          <button type="button" class="opt radio" data-react="agree" aria-pressed="false"><span class="box"></span><span>Agree</span></button>\
          <button type="button" class="opt radio" data-react="neutral" aria-pressed="false"><span class="box"></span><span>Neutral</span></button>\
          <button type="button" class="opt radio" data-react="disagree" aria-pressed="false"><span class="box"></span><span>Disagree</span></button>\
        </div>\
        <span class="toast" data-quick-msg role="status"></span>\
      </div>\
    </section>\
    <section class="panel">\
      <p class="eyebrow">Beyond this survey</p>\
      <h2>What the big industry surveys say</h2>\
      <div class="research">\
        <div class="stat"><b>86%</b><p>of 16,000+ creators in 8 countries use creative generative AI, mostly for editing and enhancement, generating images and video, and brainstorming. <a href="https://news.adobe.com/news/2025/10/adobe-max-2025-creators-survey" target="_blank" rel="noopener">Adobe Creators\' Toolkit, Oct 2025</a></p></div>\
        <div class="stat"><b>69%</b><p>of those same creators worry about their work being used to train AI without permission. <a href="https://news.adobe.com/news/2025/10/adobe-max-2025-creators-survey" target="_blank" rel="noopener">Adobe, Oct 2025</a></p></div>\
        <div class="stat"><b>6.7%</b><p>of creative professionals find fully AI-generated content acceptable, while almost 60% use AI assistance in their workflow. <a href="https://interspacemusic.com/blog/?p=18617" target="_blank" rel="noopener">Uppbeat Creator Report 2026</a></p></div>\
        <div class="stat"><b>65%</b><p>of New Zealand creatives report using generative AI in their work. <a href="https://www.academicjobs.com/nz/research-publication-news/new-zealand-creatives-generative-ai-cultural-participation-survey-9949" target="_blank" rel="noopener">NZ Cultural Participation Survey, 2026</a></p></div>\
      </div>\
      <p class="fine">Each survey defines "use" differently, so the numbers aren\'t directly comparable.</p>\
    </section>\
    <section class="panel follow">\
      <p class="eyebrow">Optional</p>\
      <h2>Want to say more?</h2>\
      <p class="sub">I\'m talking with a handful of creators: a 15-minute call, or one voice memo if your calendar is a mess. Your contact info is stored separately from your quiz answers.</p>\
      <form id="ff">\
        <label for="ff-contact">Email or social handle</label>\
        <input type="text" id="ff-contact" maxlength="120" autocomplete="off" placeholder="you@email.com or @handle">\
        <div class="chips" role="group" aria-label="Preferred format">\
          <button type="button" class="opt radio" data-how="call" aria-pressed="true"><span class="box"></span><span>15-min call</span></button>\
          <button type="button" class="opt radio" data-how="memo" aria-pressed="false"><span class="box"></span><span>Voice memo</span></button>\
          <button type="button" class="opt radio" data-how="either" aria-pressed="false"><span class="box"></span><span>Either</span></button>\
        </div>\
        <div class="row"><button class="btn" type="submit" id="ff-go">Count me in</button><span class="toast" id="ff-msg" role="status"></span></div>\
      </form>\
    </section>\
    <section class="panel">\
      <p class="eyebrow">Pass it on</p>\
      <h2>The more creators answer, the clearer the picture</h2>\
      <p class="sub">Send this to a creator friend. They\'ll see how they compare too.</p>\
      ' + (shareLink ? '<div class="share-row"><span class="linkbox" id="link">' + esc(shareLink) + '</span><button class="btn" id="copy">Copy link</button></div><span class="toast" id="copy-msg" role="status"></span>' : '<p class="fine">The share link appears here once the survey is live.</p>') + '\
    </section>\
  </div>';

  var TINTS = ["", "t-blue", "t-lav", "t-rose", "t-gold", "t-pista"];
  app.querySelectorAll(".panel").forEach(function(el, k){ var t = TINTS[k % TINTS.length]; if (t) el.classList.add(t); });

  // animate reveal markers from 0 to their value
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    app.querySelectorAll(".reveal-mark").forEach(function(m){ m.style.left = Math.max(4, Math.min(96, +m.getAttribute("data-left"))) + "%"; });
  }); });

  // optional one-tap questions on the results screen (each sent once, separately from the quiz answers)
  app.querySelectorAll("[data-quick]").forEach(function(group){
    var question = group.getAttribute("data-quick"), key = "yrwai_quick_" + question, msg = group.querySelector("[data-quick-msg]");
    var btns = group.querySelectorAll("[data-react]");
    function paint(v, lock){ btns.forEach(function(o){ var me = o.getAttribute("data-react") === v; o.setAttribute("aria-pressed", me); o.disabled = !!lock && !me; }); }
    var sent = store(key);
    if (sent){ paint(sent, true); msg.textContent = "Thanks for sharing."; }
    btns.forEach(function(b){ b.onclick = function(){
      if (store(key) || b.disabled) return;
      var v = b.getAttribute("data-react"); paint(v, true); msg.style.color = ""; msg.textContent = "";
      call("saveReaction", { question: question, reaction: v }).then(function(r){
        if (r && r.preview){ msg.textContent = "Preview mode: not saved."; return; }
        store(key, v); msg.textContent = "Thanks for sharing.";
      }).catch(function(){ paint("", false); msg.style.color = "var(--heart)"; msg.textContent = "That didn't save. Tap again in a moment."; });
    }; });
  });

  // follow-up form
  var how = "call";
  app.querySelectorAll("[data-how]").forEach(function(b){ b.onclick = function(){ how = b.getAttribute("data-how"); app.querySelectorAll("[data-how]").forEach(function(o){ o.setAttribute("aria-pressed", o===b); }); }; });
  document.getElementById("ff").onsubmit = function(e){
    e.preventDefault();
    var c = document.getElementById("ff-contact").value.trim(), msg = document.getElementById("ff-msg");
    if (c.length < 3){ msg.style.color="var(--heart)"; msg.textContent = "Add an email or handle so I can reach you."; return; }
    var go = document.getElementById("ff-go"); go.disabled = true;
    call("saveFollowup", { contact: c, how: how }).then(function(r){
      msg.style.color=""; msg.textContent = r && r.preview ? "Preview mode: not saved." : "Got it. Thank you!";
      document.getElementById("ff-contact").value = "";
    }).catch(function(){ go.disabled = false; msg.style.color="var(--heart)"; msg.textContent = "That didn't save. Try again in a moment."; });
  };
  // refresh (first 100 only): pull the latest totals and redraw in place
  var rb = document.getElementById("refresh-results");
  if (rb) rb.onclick = function(){
    var y = window.scrollY, rm = document.getElementById("refresh-msg");
    rb.disabled = true; rm.style.color = ""; rm.textContent = "Checking for new answers\u2026";
    call("getResults").then(function(agg){
      state.results = agg; renderResults(); window.scrollTo(0, y);
      var m2 = document.getElementById("refresh-msg");
      if (m2) m2.textContent = "Updated. " + (agg.n || 0) + (agg.n === 1 ? " creator" : " creators") + " so far.";
    }).catch(function(){ rb.disabled = false; rm.style.color = "var(--heart)"; rm.textContent = "Couldn\u2019t refresh. Try again in a moment."; });
  };
  // share / copy the snapshot card
  var cardMsg = document.getElementById("card-msg");
  var copied = function(){ cardMsg.style.color = ""; cardMsg.textContent = "Copied. Paste it anywhere."; };
  var failed = function(){ cardMsg.style.color = "var(--heart)"; cardMsg.textContent = "Couldn't copy here. Try a screenshot of this card."; };
  document.getElementById("share-link").onclick = function(){
    if (!shareLink){ cardMsg.style.color = ""; cardMsg.textContent = "The survey link shows up here once it's live."; return; }
    copyText(shareLink).then(function(){ cardMsg.style.color = ""; cardMsg.textContent = "Survey link copied. Send it to a creator friend."; }, failed);
  };
  document.getElementById("save-card").onclick = function(){ saveCardImage(st, sameStatus, shareLink, cardMsg); };
  document.getElementById("share-card").onclick = function(){
    var data = { title: "Your AI Relationship Status", text: snap.text };
    if (navigator.share && (!navigator.canShare || navigator.canShare(data))){
      navigator.share(data).catch(function(err){ if (!err || err.name !== "AbortError") copyText(snap.text).then(copied, failed); });
    } else copyText(snap.text).then(copied, failed);
  };
  var copy = document.getElementById("copy");
  if (copy) copy.onclick = function(){
    var m = document.getElementById("copy-msg");
    navigator.clipboard.writeText(shareLink).then(function(){ m.textContent = "Copied."; }, function(){
      var r = document.createRange(); r.selectNodeContents(document.getElementById("link")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); m.textContent = "Selected. Press copy on your keyboard.";
    });
  };
}

renderIntro();
})();
</script>
